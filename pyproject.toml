[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pystarc"
version = "1.1.0"
description = "PySTARC - Python Simulation Toolkit for Association Rate Constants"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anupam Anand Ojha" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.0",
    "numba>=0.57",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/anandojha/PySTARC"
Repository = "https://github.com/anandojha/PySTARC"
Issues = "https://github.com/anandojha/PySTARC/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-sugar",
]
notebook = ["jupyter", "matplotlib"]

[project.scripts]
pystarc = "pystarc.cli.main:main"
nam_simulation = "pystarc.cli.main:nam_simulation"
bounding_box    = "pystarc.cli.main:bounding_box_cmd"
pqr_to_xml      = "pystarc.cli.main:pqr_to_xml"

[tool.setuptools.packages.find]
where = ["."]
include = ["pystarc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
omit = [
    "pystarc/forces/gpu_batch_engine.py",
    "pystarc/forces/engine.py",
    "pystarc/simulation/gpu_batch_simulator.py",
    "pystarc/pipeline/run_apbs.py",
    "pystarc/pipeline/prepare_bd_surface.py",
    "pystarc/pipeline/make_pqr.py",
    "pystarc/pipeline/parameterize.py",
    "pystarc/pipeline/pipeline.py",
    "pystarc/multi_GPU/*",
]
